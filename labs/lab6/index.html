<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coleção de Cromos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <p><a href="../../index.html">Portefólio</a></p>
      <h1>Coleção de Cromos</h1>
    </header>

    <main>
      <section id="colecao" aria-labelledby="titulo-colecao">
        <h2 id="titulo-colecao">A minha coleção</h2>
        <ul aria-live="polite"></ul>
        <p>Total de cromos: <strong id="total-colecao">0</strong></p>
        <form>
          <label for="numero-cromo">Número do cromo</label>
          <input
            id="numero-cromo"
            name="numero"
            type="number"
            min="1"
            step="1"
            placeholder="Número"
            required
          />
          <!-- html-validate-disable prefer-button -->
          <input type="submit" value="Registar cromo" />
          <!-- html-validate-enable prefer-button -->
        </form>
      </section>

      <section id="repetidos" aria-labelledby="titulo-repetidos">
        <h2 id="titulo-repetidos">Cromos repetidos</h2>
        <ul aria-live="polite"></ul>
        <p>Total de repetidos: <strong id="total-repetidos">0</strong></p>
      </section>
    </main>

    <footer>
      <p>2026, ULusófona</p>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
